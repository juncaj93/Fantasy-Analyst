name: Daily production sweep

# The depth the deploy gate no longer pays for, paid for once a day.
#
# #248 split production checking in two. A deploy runs the eight `@critical`
# specs at one width, because the questions a *deployment* can fail are about
# the deployment: is the released revision live, does it boot cold, does the
# API answer, can a roster be read, is a stranger's write refused. Cross-width
# rendering is a property of the code, and `ci.yml` already asks that at four
# widths on every pull request.
#
# This is where the rest went. Every width, every screen photographed in both
# themes, against whatever is actually live.
#
# ## Why a wrapper rather than a `schedule:` inside `smoke.yml`
#
# It was inside `smoke.yml` for about twenty minutes, and it broke every
# deploy. `smoke.yml` is a *reusable* workflow that `deploy.yml` and
# `rollback.yml` call, and the alarm below needs `issues: write`. A called
# workflow cannot hold permissions its caller does not, and the deploy job
# calling smoke grants none -- so the whole Deploy run failed validation before
# a single job started, with `startup_failure` and no logs to say why.
#
# Granting `issues: write` to the deploy path would have fixed the symptom by
# letting a deployment write issues, which is not a permission a deployment
# should carry. Owning the schedule here instead keeps `smoke.yml` a pure
# reusable workflow with no ambient triggers, and puts the alarm in the same
# file as the schedule it is the alarm for.

on:
  schedule:
    # 07:30 UTC: after the daily 09:00 tick has not yet run and well clear of
    # the game-day windows, so a sweep never competes with a refresh.
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  # Has somebody already run this by hand today?
  #
  # On 8 September the answer was yes, twice, and this ran anyway. Three full
  # passes read about 5.06 million of the day's 5.33 million rows between them
  # and the app spent the rest of the day answering errors.
  #
  # A dispatched run is a full pass by default and is the *same check* this
  # would perform, against the same live site, on the same day. Doing it again
  # a few hours later learns nothing and costs a third of the allowance. So on
  # a day that already had one, this stands down and says so.
  #
  # Only `workflow_dispatch` runs count. A deploy's smoke is the eight-spec
  # gate at one width, which is not this check and does not substitute for it.
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ran_today: ${{ steps.check.outputs.ran_today }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          # Runs of the reusable smoke workflow started by a person today.
          count=$(gh api "repos/$REPO/actions/workflows/smoke.yml/runs?event=workflow_dispatch&created=>=$today" \
                    --jq '[.workflow_runs[] | select(.created_at | startswith("'"$today"'"))] | length' 2>/dev/null || echo 0)
          echo "manual full passes already run today: $count"
          if [ "$count" -gt 0 ]; then
            echo "ran_today=yes" >> "$GITHUB_OUTPUT"
            {
              echo "### Daily sweep stood down"
              echo ""
              echo "$count full production pass(es) were already dispatched by hand today, against the same live site."
              echo "Running a second one learns nothing and costs about a third of the daily D1 allowance."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ran_today=no" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: recent
    if: ${{ needs.recent.outputs.ran_today == 'no' }}
    uses: ./.github/workflows/smoke.yml
    with:
      # The whole point of this workflow. Without it this would be the deploy
      # gate again, on a timer, checking eight specs it already checked.
      full: true
      # One width rather than three. See the note in `smoke.yml`: `ci.yml`
      # already runs four widths against a seeded local build on every pull
      # request, and what only production can answer is width-independent.
      widths: primary

  # Scheduled work that fails silently is scheduled work nobody is doing.
  # `Refresh draft order` failed on every run for eleven days in August and was
  # found by somebody going looking; `tests/scheduledJobAlert.test.ts` refuses a
  # scheduled workflow that has no alarm.
  alert:
    needs: [recent, sweep]
    # A sweep that stood down is not a sweep that failed. `skipped` reaching
    # `alert-on-failure` would open an issue every time the guard worked, which
    # is the fastest way to teach somebody to close these unread.
    if: ${{ always() && needs.recent.outputs.ran_today == 'no' }}
    uses: ./.github/workflows/alert-on-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow: Daily production sweep
      result: ${{ needs.sweep.result }}
