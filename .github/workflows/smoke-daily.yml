name: Daily production sweep

# The depth the deploy gate no longer pays for, paid for once a day.
#
# #248 split production checking in two. A deploy runs the eight `@critical`
# specs at one width, because the questions a *deployment* can fail are about
# the deployment: is the released revision live, does it boot cold, does the
# API answer, can a roster be read, is a stranger's write refused. Cross-width
# rendering is a property of the code, and `ci.yml` already asks that at four
# widths on every pull request.
#
# This is where the rest went. Every width, every screen photographed in both
# themes, against whatever is actually live.
#
# ## Why a wrapper rather than a `schedule:` inside `smoke.yml`
#
# It was inside `smoke.yml` for about twenty minutes, and it broke every
# deploy. `smoke.yml` is a *reusable* workflow that `deploy.yml` and
# `rollback.yml` call, and the alarm below needs `issues: write`. A called
# workflow cannot hold permissions its caller does not, and the deploy job
# calling smoke grants none -- so the whole Deploy run failed validation before
# a single job started, with `startup_failure` and no logs to say why.
#
# Granting `issues: write` to the deploy path would have fixed the symptom by
# letting a deployment write issues, which is not a permission a deployment
# should carry. Owning the schedule here instead keeps `smoke.yml` a pure
# reusable workflow with no ambient triggers, and puts the alarm in the same
# file as the schedule it is the alarm for.

on:
  schedule:
    # 00:47 UTC, 47 minutes after Cloudflare resets the D1 allowance at 00:00.
    #
    # It was 07:30 and never ran at 07:30. GitHub starts a scheduled run when it
    # has capacity, and every run since 8 September began between 11:39 and
    # 16:14 UTC: 4h09 to 8h44 late, 6h on a typical day. By then the day's
    # allowance has usually been spent past the 30% line by deploys and by
    # people using the app, so the guard stood the sweep down on 30 September
    # and 6 October and nothing was tested.
    #
    # Right after the reset the whole allowance is free, and a morning's worth
    # of lateness leaves it that way: the app's own jobs read about half a
    # percent of a day, and nobody is deploying at 1am Eastern. The worst start
    # seen (8h44) from 00:47 lands at 09:31 UTC, still before the 09:00 tick has
    # had hours to matter and before a US morning. Even a start that late finds
    # the budget close to untouched.
    #
    # Why :47 and not :30. Cloudflare's usage figures lag a few minutes, so
    # :00 would read yesterday's tail, and GitHub's own scheduler is busiest on
    # the hour and half hour, where a start is delayed longest. An odd minute
    # is picked up soonest.
    #
    # Nothing else keys off this time: no test, workflow or document names it,
    # and the deploy-time smoke is a separate, called workflow with its own
    # gate. The day boundary is the only thing that matters, and it is UTC on
    # both sides: this file's `recent` check and the guard each ask about "today"
    # in UTC.
    - cron: '47 0 * * *'
  workflow_dispatch:
    inputs:
      ceiling_percent:
        description: "Stand the sweep down when today has read this much of the D1 allowance. Leave blank for the guard's 30. Set 0 to see a stand-down on purpose."
        required: false
        default: ''
        type: string

jobs:
  # Has somebody already run this by hand today?
  #
  # On 8 September the answer was yes, twice, and this ran anyway. Three full
  # passes read about 5.06 million of the day's 5.33 million rows between them
  # and the app spent the rest of the day answering errors.
  #
  # A dispatched run is a full pass by default and is the *same check* this
  # would perform, against the same live site, on the same day. Doing it again
  # a few hours later learns nothing and costs a third of the allowance. So on
  # a day that already had one, this stands down and says so.
  #
  # Only `workflow_dispatch` runs count. A deploy's smoke is the eight-spec
  # gate at one width, which is not this check and does not substitute for it.
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ran_today: ${{ steps.check.outputs.ran_today }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          # Runs of the reusable smoke workflow started by a person today.
          count=$(gh api "repos/$REPO/actions/workflows/smoke.yml/runs?event=workflow_dispatch&created=>=$today" \
                    --jq '[.workflow_runs[] | select(.created_at | startswith("'"$today"'"))] | length' 2>/dev/null || echo 0)
          echo "manual full passes already run today: $count"
          if [ "$count" -gt 0 ]; then
            echo "ran_today=yes" >> "$GITHUB_OUTPUT"
            {
              echo "### Daily sweep stood down"
              echo ""
              echo "$count full production pass(es) were already dispatched by hand today, against the same live site."
              echo "Running a second one learns nothing and costs about a third of the daily D1 allowance."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ran_today=no" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: recent
    if: ${{ needs.recent.outputs.ran_today == 'no' }}
    uses: ./.github/workflows/smoke.yml
    # The one secret the sweep needs, and only that one.
    #
    # Without this the budget guard inside `smoke.yml` saw an empty token and
    # declined every morning from 2026-09-03: a called workflow is given no
    # secrets at all unless its caller passes them, which is easy to miss
    # precisely because `secrets.CLOUDFLARE_API_TOKEN` is spelled the same in
    # both files and is perfectly valid in one of them.
    #
    # Named rather than `secrets: inherit`: this sweep runs unattended against
    # the live site every morning, and there is no reason for it to be holding
    # the passphrase or the odds key to count database rows.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    with:
      # The whole point of this workflow. Without it this would be the deploy
      # gate again, on a timer, checking eight specs it already checked.
      full: true
      # One width rather than three. See the note in `smoke.yml`: `ci.yml`
      # already runs four widths against a seeded local build on every pull
      # request, and what only production can answer is width-independent.
      widths: primary
      # Blank on a schedule, which `smoke.yml` reads as the guard's own 30. It is
      # only ever filled by a person dispatching this by hand to see the
      # stand-down path work, and the 30 itself is not changed by it.
      ceiling_percent: ${{ inputs.ceiling_percent }}

  # Did the guard stand the sweep down? Then nothing was tested today.
  #
  # `sweep` ends `success` in that case, because the guard job did its work and
  # the browser job was skipped, and a skipped job does not turn a run red. Read
  # naively that is a pass: the alert below recorded it as one, cleared this
  # workflow's row on "Scheduled job failures" and closed #204 with "Nothing is
  # failing" on 30 September and 6 October, with not one spec run.
  #
  # So the stand-down is told apart here, from the guard's own answer, and is
  # recorded as what it is: a day that was not checked.
  #
  # Only a *successful* sweep that says `no` is a stand-down. A guard that could
  # not read usage exits non-zero and also writes `no`; that is a failed sweep
  # and still goes to the alarm as one.
  stood-down:
    needs: [recent, sweep]
    if: ${{ always() && needs.recent.outputs.ran_today == 'no' && needs.sweep.result == 'success' && needs.sweep.outputs.proceed == 'no' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # Only to end this run as cancelled; see the last step.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # One short comment on the tracking issue, at most one a day, and nothing
      # else on it: not its state, not its body, not this workflow's row. The
      # issue is left exactly as it was, open or closed, failing or clear.
      - name: Say the sweep did not run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEP_PERCENT: ${{ needs.sweep.outputs.percent }}
          SWEEP_CEILING: ${{ needs.sweep.outputs.ceiling }}
        run: node scripts/sweep-stand-down-note.mjs
      - name: Write the summary
        env:
          SWEEP_PERCENT: ${{ needs.sweep.outputs.percent }}
          SWEEP_CEILING: ${{ needs.sweep.outputs.ceiling }}
        run: |
          {
            echo "### Daily sweep did NOT run"
            echo ""
            echo "D1 reads were at ${SWEEP_PERCENT}% of today's allowance (guard ${SWEEP_CEILING}%), so no spec was run."
            echo "This run is ended as cancelled on purpose: it must not read as a pass."
            echo "The tracking issue was left as it was."
          } >> "$GITHUB_STEP_SUMMARY"
      # End the whole run as cancelled, which GitHub draws grey rather than
      # green. A run cannot be given a "neutral" conclusion from inside, and a
      # green tick on a day nothing was checked is the thing this exists to
      # stop. Last, and only if the note above succeeded: if it did not, this
      # job fails red, which is the louder outcome and the right one.
      - name: End the run as not run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel"
          # Cancelling interrupts this very job. Wait to be stopped rather than
          # finishing first and letting the run end green.
          sleep 120
          echo "::error::the run was asked to cancel and is still going"
          exit 1

  # Scheduled work that fails silently is scheduled work nobody is doing.
  # `Refresh draft order` failed on every run for eleven days in August and was
  # found by somebody going looking; `tests/scheduledJobAlert.test.ts` refuses a
  # scheduled workflow that has no alarm.
  alert:
    needs: [recent, sweep]
    # A sweep that stood down is not a sweep that failed, and it is not one
    # that passed either, so it never reaches the alarm at all. `skipped`
    # reaching `alert-on-failure` would be ignored, but a `success` would clear
    # this workflow's row and close the issue, which is the false clear this
    # guard exists to prevent. `stood-down` above owns that day.
    if: ${{ always() && needs.recent.outputs.ran_today == 'no' && !(needs.sweep.result == 'success' && needs.sweep.outputs.proceed == 'no') }}
    uses: ./.github/workflows/alert-on-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow: Daily production sweep
      result: ${{ needs.sweep.result }}
