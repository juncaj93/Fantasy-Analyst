name: Browser stability check

# Run named browser specs many times in a row, at one width, in the same WebKit
# image CI uses, and say how many of the runs failed.
#
# Why this exists: a spec that "sometimes fails" cannot be fixed by reading it
# and cannot be shown fixed by one green run. CI retries a failure once, so a
# flaky spec is mostly invisible there, and the sandbox this repository is
# worked in cannot run WebKit at all. This is the one place a fix to a flaky
# spec can be repeated ten times under the real engine and counted.
#
# By hand only, from the Actions tab. It reads the app's own seeded test
# server, never production, so it costs no D1 rows.
#
#   Actions -> Browser stability check -> Run workflow
#     project: webkit-small-360
#     grep:    refreshes from the button
#     repeat:  10

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project, e.g. webkit-iphone-430 or webkit-small-360'
        required: true
        default: 'webkit-iphone-430'
        type: string
      grep:
        description: 'Only specs whose title matches this (a regular expression)'
        required: true
        type: string
      repeat:
        description: 'How many times to run each matching spec'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

jobs:
  repeat:
    name: ${{ inputs.project }} x${{ inputs.repeat }}
    runs-on: ubuntu-latest
    # Same image, user and pin as `ci.yml`; see the long note there for why.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check the image carries the browser this Playwright wants
        timeout-minutes: 10
        run: |
          wanted="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          echo "lockfile resolves Playwright to $wanted; image is pinned to v1.62.1-noble"
          npx playwright install webkit
      # No retries: the point is to count the failures a retry would hide.
      - name: Run the specs repeatedly
        timeout-minutes: 20
        env:
          PROJECT: ${{ inputs.project }}
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -eu
          npx playwright test --project="$PROJECT" --grep "$GREP" --repeat-each="$REPEAT" --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stability-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
