name: CI

# Once per commit, not twice.
#
# `push: ['**']` plus `pull_request` meant every commit on a branch with a PR
# open ran the whole workflow twice — eight WebKit runners, not four, each of
# them fetching WebKit's system packages from apt at the same moment. That
# contention is measurable rather than theoretical: on one afternoon the same
# `playwright install --with-deps` step ran in 5 minutes on one runner and
# still had not finished after 28 on another beside it, and three of four
# widths were cancelled having never started a test.
#
# So: `main` is verified on every push, and everything else is verified on its
# pull request. Nothing loses coverage — a branch is gated before it can merge,
# and main is gated after — and the apt load halves.
#
# This matters more since the widths were sharded three ways: the browser job is
# twelve runners now rather than four, so a duplicated workflow would ask for
# twenty-four at once. None of them touch apt any more — see the container image
# on the `e2e` job — but twelve is a number worth only asking for once.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the local test database) needs 22.5+
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The dry-run validates wrangler.toml and bundles the worker, which needs
      # the site build to exist because it is served as static assets.
      - run: npm run build

      # Bytes, not milliseconds. A gzipped size is identical on a laptop and on
      # a loaded shared runner, so a failure here is always a real regression
      # and never the runner having a bad morning. See docs/BUDGETS.md.
      - name: Performance budgets
        run: npm run perf:budget

      - name: Verify the worker bundles for Cloudflare
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run

  e2e:
    # Width and shard, both in the name, because that is what a red tick has to
    # answer first: *which* phone, and *which third of the suite*. GitHub would
    # otherwise label these `e2e (webkit-iphone-430, 1)`, which needs the matrix
    # definition open beside it to read.
    #
    # The denominator appears twice — here and in `--shard=` below — and the two
    # have to move together with the `shard:` list. Three literals, one number.
    name: ${{ matrix.project }} (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    # The browser and its system libraries arrive with the image, rather than
    # being installed onto a runner that is busy installing something else.
    #
    # This replaces `playwright install --with-deps webkit`, and it is here
    # because of what that command turned out to cost. `--with-deps` shells out
    # to apt, the hosted runner image does its own package work in the first
    # minutes of a job, and apt has no timeout — so on an unlucky runner the
    # install sat on `/var/lib/apt/lists/lock` until the job ceiling killed it,
    # before a single test ran. Widths that started after the lock cleared
    # installed in thirty seconds off the same commit, which is why it looked
    # like a flaky browser for as long as it did rather than a queue.
    #
    # Waiting the lock out was tried and is not a fix: the runner's package work
    # outlasts any wait short enough to be worth having, and the failure stays
    # random because it depends on which runner you land on. This removes the
    # dependency instead of budgeting for it. Microsoft publishes this image for
    # exactly this purpose, the libraries are baked in, and no apt runs at all.
    #
    # The tag is pinned to the Playwright version the lockfile resolves to, and
    # the step below re-checks that rather than trusting the pin: when the two
    # drift, the browser is downloaded into the container, which costs a minute
    # and touches no package manager. Drift is therefore slow, never broken.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # The image's default user does not own the workspace the runner mounts,
      # so writes — npm's cache, Playwright's report — fail without this.
      options: --user 1001

    # A hung browser is a real failure mode, and without this it is invisible:
    # the job sits at "in progress" for six hours and nobody learns anything.
    #
    # This is a *job* ceiling, so it pays for setup as well as tests and on its
    # own cannot say which of the two overran. Each step that can block carries
    # its own budget below for exactly that reason, and this number's only job
    # is to stay comfortably larger than their sum, so that an overrun is named
    # by the step that caused it. A job ceiling that becomes the binding
    # constraint reports "something took too long", which is the one thing it
    # exists not to say.
    #
    # The arithmetic: ten for the browser check, eighteen for the tests, and
    # container start, checkout and `npm ci` either side — 27s, 3s, 2s and 5s on
    # the last run of `main`, so call it a minute. Twenty-nine, and thirty-two
    # leaves the steps binding rather than this.
    #
    # It went 20 → 35 → 40 across three raises, each covering a suite that had
    # outgrown the previous number rather than a browser that was stuck. Down,
    # now, for the first time: the number below is what actually changed and
    # this one only follows it.
    timeout-minutes: 32

    strategy:
      # Every width reports for itself: a failure at 360 is usually a layout
      # fact about 360, and cancelling the others would hide whether it is. The
      # same goes for a shard — one third failing is a fact about those specs,
      # and the other two thirds still have to say whether they agree.
      fail-fast: false
      matrix:
        # 430 is the Pro Max class, and it is here for the opposite reason to
        # 360: the narrow one catches anything that overflows, and the wide one
        # catches anything only ever tuned for a narrow screen — a control row
        # that stretches, a fixed field that stops looking fixed.
        project: [webkit-iphone-430, webkit-iphone-390, webkit-iphone-375, webkit-small-360]
        # Each width across three runners instead of one. See the test step.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The browser the image already has, checked rather than assumed.
      #
      # The container tag is pinned by hand and `@playwright/test` is a caret
      # range, so the two can drift apart — and a WebKit build from a different
      # Playwright is not something to discover halfway through a suite. This
      # says which is which, and downloads the right build when they disagree.
      #
      # `install` without `--with-deps`, deliberately and permanently: the
      # system libraries are in the image, and the apt call is the thing this
      # whole arrangement exists to remove. On the expected path — tag and
      # lockfile agreeing — it finds the browser in place and returns in
      # seconds.
      - name: Check the image carries the browser this Playwright wants
        timeout-minutes: 10
        run: |
          wanted="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          echo "lockfile resolves Playwright to $wanted; image is pinned to v1.62.1-noble"
          if [ "$wanted" != "1.62.1" ]; then
            echo "::warning::the container tag and the lockfile have drifted (image v1.62.1, lockfile $wanted); downloading the browser this Playwright wants. Repin the image tag to v$wanted."
          fi
          npx playwright install webkit

      # A third of the suite, at one width. This is the one step that can hang,
      # and eighteen minutes of *testing* is a stuck browser however long the
      # setup took beforehand.
      #
      # Sharding, rather than a fourth raise of the ceiling. The ceiling went
      # 20 → 25 → 30 across three commits, each raise honest about what it was
      # — a suite that had legitimately grown, not a browser that was stuck —
      # and each one leaving the number measuring the suite's size instead of
      # the failure it was written to catch. `docs/STATUS.md` had this recorded
      # as blocking rather than recommended. Here is the measurement it was
      # blocking on, from `main` at a5448ef — four widths, one commit, the whole
      # suite on one runner each:
      #
      #     360   19m24s   green
      #     375   23m12s   green
      #     390   23m36s   green
      #     430   25m03s   green, with 4m57s of a thirty-minute budget left
      #
      # Every width was green and nothing was flaky. That is the point: at 430
      # the suite was inside five minutes of a ceiling it had already pushed up
      # three times, and the next feature to add a spec file would have spent
      # that too. The number was going to keep meaning "the suite grew".
      #
      # `--shard=n/3` is Playwright's own split, so nothing here enumerates
      # which specs go where and a new spec file is picked up by whichever shard
      # the split puts it in. With `fullyParallel: false` the unit of splitting
      # is a whole file, so no file is ever cut in half and every spec still
      # runs in its own file's order, beside the same neighbours, against a
      # server seeded exactly as before — three servers now instead of one, each
      # a fresh `FA_SEED=1` boot, which is if anything stricter isolation than
      # the single shared server the suite used to share across a whole width.
      #
      # Three, not two, and not four. Playwright balances shards by test count,
      # so the interesting question is what that does to *time*; measured
      # against the real per-file durations of a full local run, the slowest
      # shard carries 54% of the suite at two shards, 42% at three and 35% at
      # four. Two leaves the slowest width near fourteen minutes, which is not
      # far enough from the ceiling to stop this conversation happening again;
      # four buys three more minutes for a third again as many runners and a
      # worse spread. Three puts the slowest shard of the slowest width at
      # roughly eleven minutes.
      #
      # Measured, on the first sharded run — the twelve test steps, in minutes:
      #
      #             1/3     2/3     3/3
      #     430   10m11    8m19    6m15
      #     390    9m37    7m50    6m58
      #     375    9m25    7m46    5m50
      #     360    9m29    7m41    6m46
      #
      # All twelve green. **Expect a steady state of six to ten minutes a shard,
      # and about eleven for the whole workflow** — it was 25m47s. Shard 1 is
      # the slowest at every width, consistently rather than randomly, which is
      # the count-versus-time imbalance the paragraph above predicted at 42%.
      # Aggregate runner time went up 5%, which is the price of three server
      # boots per width instead of one and is what buys the wall clock.
      #
      # So eighteen: 1.77× the worst shard actually measured, which covers the
      # half-again-slower runner this file has seen twice, and it is a ceiling
      # that means "stuck" again rather than "big". The suite can grow by
      # three quarters before this needs looking at, and when it does the answer
      # is a fourth shard — a one-character change to the three literals above
      # and below — rather than a fourth raise.
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
        timeout-minutes: 18
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Artifact names have to be unique across a matrix, or the jobs race
          # to write one and all but the first fail on upload. The engine is in
          # the project name, so this reads browser, width and shard — which is
          # what you need to know before opening a trace.
          name: playwright-report-${{ matrix.project }}-shard-${{ matrix.shard }}-of-3
          path: |
            playwright-report/
            test-results/
          retention-days: 7
