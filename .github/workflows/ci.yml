name: CI

# Once per commit, not twice.
#
# `push: ['**']` plus `pull_request` meant every commit on a branch with a PR
# open ran the whole workflow twice — eight WebKit runners, not four, each of
# them fetching WebKit's system packages from apt at the same moment. That
# contention is measurable rather than theoretical: on one afternoon the same
# `playwright install --with-deps` step ran in 5 minutes on one runner and
# still had not finished after 28 on another beside it, and three of four
# widths were cancelled having never started a test.
#
# So: `main` is verified on every push, and everything else is verified on its
# pull request. Nothing loses coverage — a branch is gated before it can merge,
# and main is gated after — and the apt load halves.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the local test database) needs 22.5+
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The dry-run validates wrangler.toml and bundles the worker, which needs
      # the site build to exist because it is served as static assets.
      - run: npm run build

      # Bytes, not milliseconds. A gzipped size is identical on a laptop and on
      # a loaded shared runner, so a failure here is always a real regression
      # and never the runner having a bad morning. See docs/BUDGETS.md.
      - name: Performance budgets
        run: npm run perf:budget

      - name: Verify the worker bundles for Cloudflare
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run

  e2e:
    name: iPhone WebKit smoke tests
    runs-on: ubuntu-latest

    # The browser and everything it links against, shipped together.
    #
    # This is the canonical way this repository runs WebKit, and the history
    # behind it is worth keeping because both of the obvious alternatives were
    # tried here and both failed:
    #
    #   `playwright install --with-deps webkit` — apt hangs. The Azure mirror
    #   returns `Ign:` for every index, apt falls back to archive.ubuntu.com,
    #   and the fallback stalls mid-fetch until the job timeout kills it. Seen
    #   repeatedly, including a run where one width installed and passed while
    #   its neighbour in the same batch sat in apt for thirty-four minutes.
    #
    #   `playwright install webkit` (no deps) — no apt, and the browser will
    #   not start:
    #
    #     MiniBrowser: error while loading shared libraries: libevent-2.1.so.7:
    #       cannot open shared object file
    #
    #   `ubuntu-latest` does not carry everything WebKit links against, so the
    #   apt pass was never belt-and-braces. It was the belt.
    #
    # The official image has the libraries baked in and the browsers already at
    # /ms-playwright, so there is no apt call and no browser download in this
    # job at all — the two things that have ever hung here are simply not
    # present. The tag is pinned to the `@playwright/test` version in
    # package.json and has to be bumped with it: a mismatch fails immediately
    # and loudly ("Executable doesn't exist"), which is the failure mode we
    # want when a version drifts.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    # A hung browser is a real failure mode, and without this it is invisible:
    # the job sits at "in progress" for six hours and nobody learns anything.
    #
    # One viewport per runner, rather than all of them in sequence. The widths
    # are completely independent -- they share no state, no server and no order
    # -- so running them one after another only ever bought a longer wall clock,
    # and the suite eventually grew past this timeout and started being
    # cancelled part of the way through with nothing failing.
    #
    # Raised from 20 to 35 when that happened a second time, and the arithmetic
    # is why rather than the symptom. This is a *job* timeout, so it pays for
    # pulling the image and `npm ci` before a single test runs. The suite itself
    # is now around fourteen minutes per width on a good runner, and a shared
    # runner can be half again as slow. Twenty left roughly fourteen minutes for
    # a twenty-minute job, so the fast widths finished and the slow ones were cut
    # two thirds through: the number had quietly gone back to policing how big
    # the suite is.
    #
    # Thirty-five restores what it is for. A browser that is genuinely stuck
    # still fails here inside the hour instead of sitting until GitHub's own
    # six-hour ceiling; a suite that merely grew does not. It is deliberately
    # left where it was when the container went in, so that this run measures
    # the image against the same ceiling the apt runs were measured against.
    timeout-minutes: 35

    # The job number above pays for setup as well as tests, so on its own it
    # still cannot say *which* of the two overran — and that distinction is the
    # whole point of having it. The test step therefore carries its own budget
    # below: twenty minutes of actual testing is a stuck browser, however long
    # the image took to pull beforehand.
    strategy:
      # Every width reports for itself: a failure at 360 is usually a layout
      # fact about 360, and cancelling the other two would hide whether it is.
      fail-fast: false
      matrix:
        # 430 is the Pro Max class, and it is here for the opposite reason to
        # 360: the narrow one catches anything that overflows, and the wide one
        # catches anything only ever tuned for a narrow screen — a control row
        # that stretches, a fixed field that stops looking fixed.
        project: [webkit-iphone-430, webkit-iphone-390, webkit-iphone-375, webkit-small-360]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # No install step. The image already carries WebKit and its libraries;
      # PLAYWRIGHT_BROWSERS_PATH points at /ms-playwright and the browsers are
      # there before the job starts.
      #
      # The tag has to be bumped in step with `@playwright/test`, and
      # `tests/workflows.playwrightImage.test.ts` fails in `npm test` if it is
      # not — a second locally, rather than several minutes into four WebKit
      # jobs that then cannot find a browser.

      # This is the one that can hang. Twenty minutes of *testing* is a stuck
      # browser, and now there is nothing else in this job it could be.
      - run: npx playwright test --project=${{ matrix.project }}
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Artifact names have to be unique across a matrix, or the shards
          # race to write one and all but the first fail on upload.
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
