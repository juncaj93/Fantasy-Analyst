name: CI

# Once per commit, not twice.
#
# `push: ['**']` plus `pull_request` meant every commit on a branch with a PR
# open ran the whole workflow twice — eight WebKit runners, not four, each of
# them fetching WebKit's system packages from apt at the same moment. That
# contention is measurable rather than theoretical: on one afternoon the same
# `playwright install --with-deps` step ran in 5 minutes on one runner and
# still had not finished after 28 on another beside it, and three of four
# widths were cancelled having never started a test.
#
# So: `main` is verified on every push, and everything else is verified on its
# pull request. Nothing loses coverage — a branch is gated before it can merge,
# and main is gated after — and the apt load halves.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the local test database) needs 22.5+
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The dry-run validates wrangler.toml and bundles the worker, which needs
      # the site build to exist because it is served as static assets.
      - run: npm run build

      # Bytes, not milliseconds. A gzipped size is identical on a laptop and on
      # a loaded shared runner, so a failure here is always a real regression
      # and never the runner having a bad morning. See docs/BUDGETS.md.
      - name: Performance budgets
        run: npm run perf:budget

      - name: Verify the worker bundles for Cloudflare
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run

  e2e:
    name: iPhone WebKit smoke tests
    runs-on: ubuntu-latest

    # The browser and its system libraries arrive with the image, rather than
    # being installed onto a runner that is busy installing something else.
    #
    # This replaces `playwright install --with-deps webkit`, and it is here
    # because of what that command turned out to cost. `--with-deps` shells out
    # to apt, the hosted runner image does its own package work in the first
    # minutes of a job, and apt has no timeout — so on an unlucky runner the
    # install sat on `/var/lib/apt/lists/lock` until the job ceiling killed it,
    # before a single test ran. Widths that started after the lock cleared
    # installed in thirty seconds off the same commit, which is why it looked
    # like a flaky browser for as long as it did rather than a queue.
    #
    # Waiting the lock out was tried and is not a fix: the runner's package work
    # outlasts any wait short enough to be worth having, and the failure stays
    # random because it depends on which runner you land on. This removes the
    # dependency instead of budgeting for it. Microsoft publishes this image for
    # exactly this purpose, the libraries are baked in, and no apt runs at all.
    #
    # The tag is pinned to the Playwright version the lockfile resolves to, and
    # the step below re-checks that rather than trusting the pin: when the two
    # drift, the browser is downloaded into the container, which costs a minute
    # and touches no package manager. Drift is therefore slow, never broken.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # The image's default user does not own the workspace the runner mounts,
      # so writes — npm's cache, Playwright's report — fail without this.
      options: --user 1001

    # A hung browser is a real failure mode, and without this it is invisible:
    # the job sits at "in progress" for six hours and nobody learns anything.
    #
    # One viewport per runner, rather than all of them in sequence. The widths
    # are completely independent -- they share no state, no server and no order
    # -- so running them one after another only ever bought a longer wall clock,
    # and the suite eventually grew past this timeout and started being
    # cancelled part of the way through with nothing failing.
    #
    # Raised from 20 to 35 when that happened a second time, and the arithmetic
    # is why rather than the symptom. This is a *job* timeout, so it pays for
    # `npm ci` and `playwright install --with-deps webkit` before a single test
    # runs -- about six minutes of it. The suite itself is now around fourteen
    # minutes per width on a good runner, and a shared runner can be half again
    # as slow. Twenty left roughly fourteen minutes for a twenty-minute job, so
    # the fast widths finished and the slow ones were cut two thirds through:
    # the number had quietly gone back to policing how big the suite is.
    #
    # Thirty-five restored what it is for. A browser that is genuinely stuck
    # still fails here inside the hour instead of sitting until GitHub's own
    # six-hour ceiling; a suite that merely grew does not. That paragraph ended
    # by saying that if this ever needed raising again, the browser download was
    # the cheapest thing on the list to stop paying for. It was not the download
    # in the end — it was apt, and the container above stops paying for both.
    #
    # Back to thirty-five, and it is a real ceiling again rather than a number
    # inflated to cover a queue: ten for the browser check, twenty for the
    # tests, and setup either side. Setup is now a checkout and an `npm ci`,
    # because everything else arrives with the image.
    #
    # Each step that can block still carries its own budget, so a failure names
    # which part overran instead of leaving this one to say only "something".
    #
    # Forty, tracking the test step's move from twenty-five to thirty below. It
    # moves for one reason only: to stay *larger* than the sum of the steps it
    # contains, so that an overrun is still named by the step that caused it. A
    # job ceiling that becomes the binding constraint reports "something took too
    # long", which is the one thing this number exists not to say.
    timeout-minutes: 40

    # The job number above pays for setup as well as tests, so on its own it
    # still cannot say *which* of the two overran — and that distinction is the
    # whole point of having it. The test step therefore carries its own budget
    # below: twenty minutes of actual testing is a stuck browser, whatever apt
    # did beforehand.
    strategy:
      # Every width reports for itself: a failure at 360 is usually a layout
      # fact about 360, and cancelling the other two would hide whether it is.
      fail-fast: false
      matrix:
        # 430 is the Pro Max class, and it is here for the opposite reason to
        # 360: the narrow one catches anything that overflows, and the wide one
        # catches anything only ever tuned for a narrow screen — a control row
        # that stretches, a fixed field that stops looking fixed.
        project: [webkit-iphone-430, webkit-iphone-390, webkit-iphone-375, webkit-small-360]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The browser the image already has, checked rather than assumed.
      #
      # The container tag is pinned by hand and `@playwright/test` is a caret
      # range, so the two can drift apart — and a WebKit build from a different
      # Playwright is not something to discover halfway through a suite. This
      # says which is which, and downloads the right build when they disagree.
      #
      # `install` without `--with-deps`, deliberately and permanently: the
      # system libraries are in the image, and the apt call is the thing this
      # whole arrangement exists to remove. On the expected path — tag and
      # lockfile agreeing — it finds the browser in place and returns in
      # seconds.
      - name: Check the image carries the browser this Playwright wants
        timeout-minutes: 10
        run: |
          wanted="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          echo "lockfile resolves Playwright to $wanted; image is pinned to v1.62.1-noble"
          if [ "$wanted" != "1.62.1" ]; then
            echo "::warning::the container tag and the lockfile have drifted (image v1.62.1, lockfile $wanted); downloading the browser this Playwright wants. Repin the image tag to v$wanted."
          fi
          npx playwright install webkit

      # This is the one that can hang. Twenty-five minutes of *testing* is a
      # stuck browser however long the setup took beforehand.
      #
      # Twenty until the suite outgrew it, and this is a capacity correction
      # rather than a number inflated to cover a queue — the distinction the
      # job timeout above spends three paragraphs on, and it is worth making
      # again because the evidence here is unusually clean.
      #
      # What was measured, twice, on two different commits: `webkit-iphone-430`
      # was killed mid-run with **no test having failed** — once at test 527 of
      # 547, once at 514 of 554 — while the other three widths finished the
      # whole suite green. The last run's passing widths came in at roughly
      # 18m30s to 19m of testing, so three of four were already inside ninety
      # seconds of the ceiling and the fourth simply landed on a slower runner.
      # On main the night before, 390 finished in 19m02s: fifty-eight seconds
      # of headroom on a suite that has grown by two features since.
      #
      # So the ceiling had stopped measuring what it was written to measure. A
      # browser that is genuinely stuck still fails here well inside the hour;
      # what it had started catching instead was a suite that legitimately
      # takes longer than it used to, on a runner that happened to be slow —
      # and the signal for that is indistinguishable from a real hang, which is
      # exactly what makes it expensive.
      #
      # Twenty-five, and the job ceiling above stays at thirty-five: setup is a
      # checkout and an `npm ci`, the browser arrives with the image, so 25 + ~2
      # still leaves the job's own limit doing its job. Nothing else moved — no
      # assertion loosened, no test skipped, no retry added.
      #
      # This buys time; it does not buy capacity. Sharding each width across two
      # runners is the answer that scales, and it is in `docs/STATUS.md` under
      # recommended next work rather than here, because it is a workflow project
      # and not a line in a file.
      #
      # Twenty-five to thirty, and this is the third time. The measurement, from
      # the waiver-plan run on #181 — four widths, one commit, one afternoon:
      #
      #     375   ~17m50s   green
      #     360   ~21m27s   green
      #     390   ~22m15s   green
      #     430    25m00s   cut at test 649 of ~660, no test having failed
      #
      # 430 is reliably the slowest width — the widest viewport lays out the most
      # — and it went over by something under half a minute. What matters more is
      # 390 at 22m15s: two of four widths were inside three minutes of the
      # ceiling on the same run, so this is the suite's size and not one unlucky
      # runner. The distinction the paragraphs above spend so long on is the one
      # that decides it, and the evidence points the same way it did at twenty.
      #
      # Thirty, and the job ceiling moves with it so it keeps doing its own job
      # rather than becoming the binding constraint.
      #
      # Being honest about what this is: raising a ceiling for the third time is
      # the behaviour this file warns about two comments up, and the only reason
      # it is defensible here is that nothing was skipped, loosened or retried to
      # get green. Sharding has stopped being an optimisation and started being
      # the fix — see `docs/STATUS.md`, where it is now recorded as blocking the
      # next feature rather than merely recommended.
      - run: npx playwright test --project=${{ matrix.project }}
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Artifact names have to be unique across a matrix, or the shards
          # race to write one and all but the first fail on upload.
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
