name: CI

# Once per commit, not twice.
#
# `push: ['**']` plus `pull_request` meant every commit on a branch with a PR
# open ran the whole workflow twice — eight WebKit runners, not four, each of
# them fetching WebKit's system packages from apt at the same moment. That
# contention is measurable rather than theoretical: on one afternoon the same
# `playwright install --with-deps` step ran in 5 minutes on one runner and
# still had not finished after 28 on another beside it, and three of four
# widths were cancelled having never started a test.
#
# So: `main` is verified on every push, and everything else is verified on its
# pull request. Nothing loses coverage — a branch is gated before it can merge,
# and main is gated after — and the apt load halves.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the local test database) needs 22.5+
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The dry-run validates wrangler.toml and bundles the worker, which needs
      # the site build to exist because it is served as static assets.
      - run: npm run build

      # Bytes, not milliseconds. A gzipped size is identical on a laptop and on
      # a loaded shared runner, so a failure here is always a real regression
      # and never the runner having a bad morning. See docs/BUDGETS.md.
      - name: Performance budgets
        run: npm run perf:budget

      - name: Verify the worker bundles for Cloudflare
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run

  e2e:
    name: iPhone WebKit smoke tests
    runs-on: ubuntu-latest
    # A hung browser is a real failure mode, and without this it is invisible:
    # the job sits at "in progress" for six hours and nobody learns anything.
    #
    # One viewport per runner, rather than all three in sequence. The three
    # widths are completely independent -- they share no state, no server and no
    # order -- so running them one after another only ever bought a longer wall
    # clock, and the suite eventually grew past this timeout and started being
    # cancelled two thirds of the way through with nothing failing. Split, each
    # runner does about a third of the work, so twenty minutes goes back to
    # meaning "the browser is stuck" rather than "the suite got bigger".
    #
    # The budget is now on the step that can hang rather than on the whole job,
    # because the job stopped being mostly tests. `playwright install
    # --with-deps` fetches WebKit's system packages from apt, and that download
    # is neither fast nor predictable: measured on this repository across one
    # afternoon it ran between five and twenty minutes on identical runners,
    # and on three occasions it consumed the entire job budget without a single
    # test having started. A job-level timeout cannot tell that apart from a
    # stuck browser -- both read as "cancelled at twenty minutes" -- which is
    # precisely the signal this timeout exists to give.
    #
    # So: the job is allowed enough wall clock for a bad apt day, and the test
    # step keeps the twenty minutes, where it means what it says.
    timeout-minutes: 45
    strategy:
      # Every width reports for itself: a failure at 360 is usually a layout
      # fact about 360, and cancelling the other two would hide whether it is.
      fail-fast: false
      matrix:
        # 430 is the Pro Max class, and it is here for the opposite reason to
        # 360: the narrow one catches anything that overflows, and the wide one
        # catches anything only ever tuned for a narrow screen — a control row
        # that stretches, a fixed field that stops looking fixed.
        project: [webkit-iphone-430, webkit-iphone-390, webkit-iphone-375, webkit-small-360]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Slow and variable, and not a thing that can hang in an interesting way.
      - run: npx playwright install --with-deps webkit
        timeout-minutes: 25
      # This is the one that can. Twenty minutes of *testing* is a stuck browser.
      - run: npx playwright test --project=${{ matrix.project }}
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Artifact names have to be unique across a matrix, or the shards
          # race to write one and all but the first fail on upload.
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
