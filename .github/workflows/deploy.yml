name: Deploy

# The normal release path: authoritative CI goes green for a revision on main,
# and *that revision* goes to production.
#
# This file used to start from `push: main`, which meant a deploy and the
# strongest gate for the same commit started at the same moment and raced —
# twelve WebKit runners on one side, `wrangler deploy` on the other, and nothing
# between them. A commit that broke a phone at 360 was live before the runner
# that would have said so had finished installing. The window was the length of
# the browser suite, which is about eleven minutes.
#
# So the trigger is CI's *completion*, not the push, and what gets deployed is
# the SHA CI reports it validated — never "main, now", which by then may be a
# different commit entirely.
#
# Three things follow from that, and each has a step below:
#
#   - a failed CI deploys nothing (`conclusion == 'success'`);
#   - the exact validated SHA is what is checked out (`release.yml`);
#   - a superseded revision stands down rather than overwriting a newer one.
#
# Deploying by hand is not done from here: `rollback.yml` takes an explicit
# revision and is the one manual path to production. See docs/RELEASE.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # CI also runs on pull requests; those runs carry the PR's branch and are
    # filtered out here. Only a CI run of main can reach production.
    branches: [main]

# Everything that writes to production shares one group with `rollback.yml`, so
# a release and a rollback can never be applying to the same Worker at once.
#
# `cancel-in-progress: false` deliberately: a half-finished deploy is worse than
# a slightly late one, and the case a cancel would exist to prevent — an older
# revision landing on top of a newer one — is handled by standing down below
# instead, where it can say so.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Is this revision still the one that should be in production?
  #
  # The race this answers: A merges, CI A starts, B merges, CI B starts. Both
  # will finish, in either order, and both will land here. Whichever of them is
  # main's head deploys; the other stands down, because deploying it would mean
  # production going *backwards* to a revision that has already been superseded.
  #
  # The cost of that policy is honest and worth writing down: if A is superseded
  # by B and CI B then fails, production stays on the revision before A. It is
  # behind main, and it is a revision that passed CI — which is the direction to
  # err. `/api/health` says which one it is, and `rollback.yml` can put A live
  # by name if that is what is wanted.
  #
  # This job carries no `if:` and that is deliberate, because it used to.
  #
  # `if: github.event.workflow_run.conclusion == 'success'` reads as the gate —
  # only a green CI deploys — and it is, but it also made every other outcome
  # *silent*: the whole run came out `skipped`, with no summary, no notice and
  # nothing anywhere saying main was not in production. That is fine for the
  # case it was written for (CI is red, everybody can see CI is red) and wrong
  # for the case that actually happened: run 32983835210 concluded
  # `startup_failure`, which is GitHub failing to start the run rather than a
  # word about the code, Deploy skipped in three seconds, and `a56e366` sat
  # undeployed with the only trace a grey tick.
  #
  # Worse, the obvious recovery does not work. Re-running CI to green does not
  # re-fire this workflow — measured: CI ran its thirteen jobs again, all
  # passed, and no second Deploy run was created. So "just re-run CI" would have
  # been advice that quietly does nothing.
  #
  # The gate is unchanged — production still only receives a revision whose own
  # CI *succeeded* — but every other outcome now says so out loud and names the
  # way out, which is `rollback.yml` with the revision by name.
  decide:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because this asks an ancestry question.
          fetch-depth: 0
      - id: check
        env:
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          # Stand down, saying why, in the one place an operator will look.
          stand_down() {
            echo "proceed=no" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy stood down"
              echo
              echo "**Revision:** \`$CANDIDATE\`"
              echo
              echo "**CI:** \`$CI_CONCLUSION\` — $CI_RUN_URL"
              echo
              printf '%s\n' "$1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "CI concluded: $CI_CONCLUSION"
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"

          case "$CI_CONCLUSION" in
            success)
              : # the revision has a verdict and it is green; carry on below
              ;;
            failure | timed_out)
              # CI looked at this revision and said no. Nothing to do here: the
              # fix is a new commit, and its own CI will bring its own deploy.
              echo "::notice::CI is red for $CANDIDATE, so nothing was deployed. Production keeps the revision it has."
              stand_down "CI reported a real failure for this revision. Nothing was deployed, and production keeps the revision it already had — \`/api/health\` says which. Fix forward: the next commit's own CI brings its own deploy."
              exit 0
              ;;
            *)
              # cancelled, startup_failure, neutral, action_required, stale…
              #
              # None of these is a statement about the code. Refusing to deploy
              # is still right — an unvalidated revision must not reach
              # production — but it needs saying loudly, because this is the
              # case that otherwise looks exactly like a quiet success.
              echo "::warning::CI for $CANDIDATE ended as '$CI_CONCLUSION', which is not a verdict on the code. Nothing was deployed, and re-running CI will NOT re-trigger this deploy."
              stand_down "$(printf '%s\n' \
                "CI never reached a verdict — \`$CI_CONCLUSION\` means the run stopped without judging this revision (GitHub failed to start it, or somebody cancelled it). It is not a statement about the code. Nothing was deployed." \
                "" \
                "**Re-running CI does not re-trigger this deploy.** A re-run completes without creating a new Deploy run, so the revision would stay unreleased." \
                "" \
                "To release it: re-run CI and confirm it is green, then run **Rollback** with \`$CANDIDATE\` — it is the supported way to deploy an explicit revision, and it goes through the same build, stamp, deploy and smoke as a normal release.")"
              exit 0
              ;;
          esac

          # The refspec is spelled out rather than left to whatever the checkout
          # configured, so `origin/main` is certain to exist when it is read.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          head="$(git rev-parse origin/main)"
          echo "CI validated: $CANDIDATE"
          echo "main is now:  $head"

          if [ "$CANDIDATE" = "$head" ]; then
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
            echo "This is main's head — releasing it."
            exit 0
          fi

          if git merge-base --is-ancestor "$CANDIDATE" "$head"; then
            echo "::notice::$CANDIDATE passed CI but main has moved on to $head. Standing down: the newer revision releases when its own CI passes."
            stand_down "$(printf '%s\n' \
              "main is now \`$head\`. Releasing this revision would move production backwards, so it was skipped." \
              "" \
              "The newer revision deploys when its own CI passes. If it does not, run **Rollback** with an explicit revision — see \`docs/RELEASE.md\`.")"
            exit 0
          fi

          # Not an ancestor of main at all: main was rewritten, or this CI run
          # belongs to something that is no longer part of the branch's history.
          # Either way it is not a revision to put in front of anyone.
          echo "::error::$CANDIDATE is not in main's history (main is $head). Refusing to release it."
          exit 1

  release:
    needs: decide
    if: ${{ needs.decide.outputs.proceed == 'yes' }}
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.decide.outputs.sha }}
      origin: CI passed on main
    secrets: inherit

  # Straight after the deploy, against the revision the deploy just published —
  # not against "whatever is live", which is the assumption that lets a smoke
  # run pass for the wrong build.
  smoke:
    needs: release
    uses: ./.github/workflows/smoke.yml
    with:
      url: ${{ needs.release.outputs.url }}
      expected_sha: ${{ needs.release.outputs.sha }}
