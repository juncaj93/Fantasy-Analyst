name: Deploy

# The normal release path: authoritative CI goes green for a revision on main,
# and *that revision* goes to production.
#
# This file used to start from `push: main`, which meant a deploy and the
# strongest gate for the same commit started at the same moment and raced —
# twelve WebKit runners on one side, `wrangler deploy` on the other, and nothing
# between them. A commit that broke a phone at 360 was live before the runner
# that would have said so had finished installing. The window was the length of
# the browser suite, which is about eleven minutes.
#
# So the trigger is CI's *completion*, not the push, and what gets deployed is
# the SHA CI reports it validated — never "main, now", which by then may be a
# different commit entirely.
#
# Three things follow from that, and each has a step below:
#
#   - a failed CI deploys nothing (`conclusion == 'success'`);
#   - the exact validated SHA is what is checked out (`release.yml`);
#   - a superseded revision stands down rather than overwriting a newer one.
#
# Deploying by hand is not done from here: `rollback.yml` takes an explicit
# revision and is the one manual path to production. See docs/RELEASE.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # CI also runs on pull requests; those runs carry the PR's branch and are
    # filtered out here. Only a CI run of main can reach production.
    branches: [main]

# Everything that writes to production shares one group with `rollback.yml`, so
# a release and a rollback can never be applying to the same Worker at once.
#
# `cancel-in-progress: false` deliberately: a half-finished deploy is worse than
# a slightly late one, and the case a cancel would exist to prevent — an older
# revision landing on top of a newer one — is handled by standing down below
# instead, where it can say so.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Is this revision still the one that should be in production?
  #
  # The race this answers: A merges, CI A starts, B merges, CI B starts. Both
  # will finish, in either order, and both will land here. Whichever of them is
  # main's head deploys; the other stands down, because deploying it would mean
  # production going *backwards* to a revision that has already been superseded.
  #
  # The cost of that policy is honest and worth writing down: if A is superseded
  # by B and CI B then fails, production stays on the revision before A. It is
  # behind main, and it is a revision that passed CI — which is the direction to
  # err. `/api/health` says which one it is, and `rollback.yml` can put A live
  # by name if that is what is wanted.
  decide:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because this asks an ancestry question.
          fetch-depth: 0
      - id: check
        env:
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The refspec is spelled out rather than left to whatever the checkout
          # configured, so `origin/main` is certain to exist when it is read.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          head="$(git rev-parse origin/main)"
          echo "CI validated: $CANDIDATE"
          echo "main is now:  $head"
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"

          if [ "$CANDIDATE" = "$head" ]; then
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
            echo "This is main's head — releasing it."
            exit 0
          fi

          echo "proceed=no" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$CANDIDATE" "$head"; then
            echo "::notice::$CANDIDATE passed CI but main has moved on to $head. Standing down: the newer revision releases when its own CI passes."
            {
              echo "## Deploy stood down"
              echo
              echo "\`$CANDIDATE\` passed CI, but main is now \`$head\`."
              echo "Releasing it would move production backwards, so it was skipped."
              echo
              echo "The newer revision deploys when its own CI passes. If it does not,"
              echo "run **Rollback** with an explicit revision — see \`docs/RELEASE.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Not an ancestor of main at all: main was rewritten, or this CI run
          # belongs to something that is no longer part of the branch's history.
          # Either way it is not a revision to put in front of anyone.
          echo "::error::$CANDIDATE is not in main's history (main is $head). Refusing to release it."
          exit 1

  release:
    needs: decide
    if: ${{ needs.decide.outputs.proceed == 'yes' }}
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.decide.outputs.sha }}
      origin: CI passed on main
    secrets: inherit

  # Straight after the deploy, against the revision the deploy just published —
  # not against "whatever is live", which is the assumption that lets a smoke
  # run pass for the wrong build.
  smoke:
    needs: release
    uses: ./.github/workflows/smoke.yml
    with:
      url: ${{ needs.release.outputs.url }}
      expected_sha: ${{ needs.release.outputs.sha }}
