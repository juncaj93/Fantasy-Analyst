name: Probe

# Run a single probe script and print nothing else.
#
# The Investigate workflow answers many questions at once, which makes its log
# long and awkward to read when only one answer is wanted. This runs exactly one
# script, so the log is the answer.
#
# Read-only, like every probe.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script in scripts/ to run'
        required: true
        default: 'probe-sleeper-graphql.mjs'
      league_id:
        description: 'Ask about this league rather than the selected one (optional)'
        required: false
        default: ''
      rejections:
        description: 'Also print why candidates were rejected, where a probe supports it'
        required: false
        default: ''
      steps:
        description: 'Run only these parts of a probe that has parts, as a comma list (optional)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run it
        env:
          SCRIPT: ${{ inputs.script }}
          # Only the odds probe reads this, and it prints whether the key was
          # present rather than the key itself.
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          # Read by the probes that would otherwise ask about whichever league
          # the deployment happens to have selected. Read-only: it changes which
          # league is asked about, never which one is selected.
          LEAGUE_ID: ${{ inputs.league_id }}
          # Which parts of a multi-part probe to run (probe-cleanup-d1.mjs).
          STEPS: ${{ inputs.steps }}
          # Read by probes with a verbose mode. A probe's switches have to be
          # reachable from here or the one place it is meant to run is the one
          # place it cannot be driven: this workflow invokes `node
          # scripts/<name>.mjs` with no arguments.
          REJECTIONS: ${{ inputs.rejections }}
          # The Cloudflare token, under a name no probe reads. It is handed on
          # as CLOUDFLARE_API_TOKEN below only to the probes named there, which
          # read Cloudflare's own logs and metrics, or run SELECTs, and nothing else.
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          case "$SCRIPT" in
            probe-*.mjs) ;;
            *) echo "::error::only probe-*.mjs scripts may be run here"; exit 1 ;;
          esac
          # Probes that only read Cloudflare's own numbers (free), and the cheap
          # release-SHA check, never touch the database and are never held back.
          case "$SCRIPT" in
            probe-deployed-sha.mjs|probe-cron-outcomes.mjs|probe-cron-watch.mjs|probe-tick-state.mjs|probe-worker-logs.mjs|probe-d1-sweep-queries.mjs|probe-d1-query-costs.mjs|probe-d1-top-readers.mjs|probe-d1-usage-hours.mjs)
              GUARDED=no ;;
            *) GUARDED=yes ;;
          esac
          # The budget guard. Production probes read the same 5,000,000 rows a
          # day as Alex's own use, so before any real read this asks Cloudflare
          # (free) how much of today is gone. Over PROBE_CEILING_PERCENT the
          # probe stands down and says so; it does not fail the run.
          if [ "$GUARDED" = yes ]; then
            GUARD_OUT=$(mktemp)
            if CLOUDFLARE_API_TOKEN="$CF_TOKEN" ACCOUNT_ID="$CF_ACCOUNT" GITHUB_OUTPUT="$GUARD_OUT" \
                 node scripts/d1-budget-guard.mjs --ceiling "${PROBE_CEILING_PERCENT:-50}" --what "production probe"; then
              if grep -q '^proceed=no' "$GUARD_OUT"; then
                echo "Standing down: $SCRIPT was not run, because today's D1 reads are past ${PROBE_CEILING_PERCENT:-50}% of the daily allowance."
                echo "Nothing was read from production. Run it again after 00:00 UTC, or when the percentage above has dropped."
                exit 0
              fi
            else
              echo "::error::Could not read today's D1 usage, so $SCRIPT was not run (a wrong 'go' can cost the rest of the day)."
              exit 1
            fi
          fi
          # Probes that need to know which draft to ask about get it from the
          # live app rather than a hardcoded id.
          DRAFT_ID=""
          if [ "$GUARDED" = yes ]; then
            DRAFT_ID=$(curl -s https://fantasy-analyst.juncaj93.workers.dev/api/setup/status | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                try { console.log(JSON.parse(s).league?.draftId ?? ''); } catch { console.log(''); }
              })")
          fi
          export DRAFT_ID
          case "$SCRIPT" in
            probe-cron-outcomes.mjs|probe-cron-watch.mjs|probe-tick-state.mjs|probe-worker-logs.mjs|probe-vegas-weekend.mjs|probe-vegas-manual-spend.mjs|probe-vegas-count-gap.mjs|probe-vegas-clock.mjs|probe-d1-sweep-queries.mjs|probe-d1-query-costs.mjs|probe-waiver-reads.mjs|probe-waiver-tiers.mjs|probe-d1-top-readers.mjs|probe-cleanup-d1.mjs|probe-sgo-reset.mjs)
              export CLOUDFLARE_API_TOKEN="$CF_TOKEN" ACCOUNT_ID="$CF_ACCOUNT" ;;
          esac
          unset CF_TOKEN CF_ACCOUNT
          node "scripts/$SCRIPT"
