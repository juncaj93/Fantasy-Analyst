name: Investigate

# Read-only fact-finding, run on demand.
#
# The development sandbox cannot reach Cloudflare or most of the internet, so
# questions like "is there a domain available for the newsletter address?" or
# "does this odds provider still have a free tier?" are answered here instead of
# by guessing — or by asking a human something a machine can look up.
#
# Nothing in this workflow changes anything. It only reads and prints.

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare domains and email routing
        env:
          # The deploy token is scoped to Workers and D1 and cannot read DNS.
          # A separate, narrower token covers the mail side; fall back to the
          # deploy token so this job still reports something useful without it.
          TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          api() { curl -s -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' "https://api.cloudflare.com/client/v4$1"; }

          if [ -n "${{ secrets.CLOUDFLARE_EMAIL_TOKEN }}" ]; then
            echo "Using the dedicated email/DNS token."
          else
            echo "CLOUDFLARE_EMAIL_TOKEN is not set — falling back to the deploy token, which cannot read DNS."
          fi

          # What is this token actually allowed to do? An "Authentication error"
          # below means a missing permission, not a wrong token, and knowing
          # which one turns a vague failure into a precise instruction.
          echo "=== API token permissions ==="
          api "/user/tokens/verify" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const r = JSON.parse(s);
              console.log('  token valid:', r.success, r.result ? '| status: ' + r.result.status : '');
            })"

          echo "=== Zones (domains) on this account ==="
          zones=$(api "/zones?per_page=50")
          echo "$zones" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const r = JSON.parse(s);
              if (!r.success) { console.log('could not list zones:', JSON.stringify(r.errors)); return; }
              if (!r.result.length) { console.log('(no domains on this account)'); return; }
              for (const z of r.result) console.log(z.id, z.name, z.status);
            })"

          for id in $(echo "$zones" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const r = JSON.parse(s);
              if (r.success) for (const z of r.result) console.log(z.id);
            })"); do
            name=$(echo "$zones" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const r=JSON.parse(s); const z=r.result.find(z=>z.id===process.argv[1]);
                console.log(z ? z.name : '?');
              })" "$id")

            echo
            echo "=== $name: email routing ==="
            api "/zones/$id/email/routing" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const r=JSON.parse(s);
                if (!r.success) { console.log('  not available:', JSON.stringify(r.errors)); return; }
                console.log('  enabled:', r.result.enabled, '| status:', r.result.status, '| name:', r.result.name);
              })"

            echo "=== $name: existing routing rules ==="
            api "/zones/$id/email/routing/rules?per_page=20" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const r=JSON.parse(s);
                if (!r.success) { console.log('  not available:', JSON.stringify(r.errors)); return; }
                if (!r.result.length) { console.log('  (none)'); return; }
                for (const rule of r.result) {
                  const to = (rule.actions ?? []).map(a => a.type + ':' + (a.value ?? []).join(',')).join(' ');
                  const from = (rule.matchers ?? []).map(m => m.value ?? m.type).join(',');
                  console.log('  ', rule.name, '|', from, '->', to, '| enabled:', rule.enabled);
                }
              })"

            echo "=== $name: existing MX records (does real email already use this domain?) ==="
            api "/zones/$id/dns_records?type=MX&per_page=20" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const r=JSON.parse(s);
                if (!r.success) { console.log('  could not read DNS:', JSON.stringify(r.errors)); return; }
                // Whose mail is this? Cloudflare's own MX records are safe to
                // replace; anyone else's means real mail is being delivered
                // somewhere and enabling routing would break it.
                const who = (host) => {
                  const h = String(host).toLowerCase();
                  if (h.includes('mx.cloudflare.net')) return 'Cloudflare Email Routing';
                  if (h.includes('google') || h.includes('googlemail')) return 'Google Workspace / Gmail';
                  if (h.includes('outlook') || h.includes('protection.outlook')) return 'Microsoft 365';
                  if (h.includes('zoho')) return 'Zoho Mail';
                  if (h.includes('protonmail') || h.includes('proton.me')) return 'Proton Mail';
                  if (h.includes('improvmx')) return 'ImprovMX';
                  if (h.includes('fastmail') || h.includes('messagingengine')) return 'Fastmail';
                  return 'UNRECOGNISED — treat as real mail in use';
                };
                if (!r.result.length) { console.log('  (none — no mail currently delivered to this domain)'); return; }
                for (const d of r.result) {
                  console.log('  ', d.name, '->', d.content, 'priority', d.priority, '|', who(d.content));
                }
              })"
          done

      - name: The Odds API — free tier and NFL player prop markets
        run: |
          set -uo pipefail
          echo "=== pricing page ==="
          curl -s -L https://the-odds-api.com/ | tr '>' '>\n' | grep -iEo '[^<]*(free|500|requests)[^<]*' | head -20 || true
          echo
          echo "=== do the market keys this app asks for still exist? ==="
          doc=$(curl -s -L https://the-odds-api.com/sports-odds-data/betting-markets.html)
          for key in player_pass_yds player_pass_tds player_rush_yds \
                     player_receptions player_reception_yds player_anytime_td; do
            if printf '%s' "$doc" | grep -q "$key"; then
              echo "  $key      documented"
            else
              echo "  $key      NOT FOUND — the adapter would ask for a key that no longer exists"
            fi
          done
          echo
          echo "=== every documented NFL-shaped player key (for spotting new ones) ==="
          printf '%s' "$doc" \
            | grep -oE 'player_[a-z_]+' | sort -u \
            | grep -E 'pass|rush|recep|reception|_td|kicking|sacks|tackles|interceptions|longest' || true
          echo
          echo "=== sports endpoint reachable without a key? (expect 401) ==="
          curl -s -o /dev/null -w 'status %{http_code}\n' https://api.the-odds-api.com/v4/sports || true
