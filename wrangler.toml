name = "fantasy-analyst"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static SPA build output. `npm run build` produces dist/web.
[assets]
directory = "./dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 — create with:  wrangler d1 create fantasy_analyst
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "fantasy_analyst"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# "mock" (default, no network, no quota) or "the-odds-api".
VEGAS_PROVIDER = "mock"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   APP_PASSPHRASE   login passphrase for the private tool
#   SESSION_SECRET   random 32+ byte string used to sign session cookies
#   ODDS_API_KEY     only when VEGAS_PROVIDER = "the-odds-api"

[triggers]
# Saturday 23:00 UTC and Sunday 15:00 UTC -> Vegas refresh.
# Daily 09:00 UTC -> Sleeper player dictionary sync.
crons = ["0 23 * * 6", "0 15 * * 0", "0 9 * * *"]

[observability]
enabled = true
