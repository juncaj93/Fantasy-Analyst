name = "fantasy-analyst"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Publish to https://fantasy-analyst.<your-subdomain>.workers.dev.
# No custom domain needed; one can be added later without changing anything else.
workers_dev = true

# Static SPA build output. `npm run build` produces dist/web.
[assets]
directory = "./dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, the static-asset router answers BEFORE the Worker and the
# single-page-application fallback would return index.html for /api/* — the API
# would never run. Worker-first on /api/* keeps the API live while static files
# are still served directly by the asset router.
run_worker_first = ["/api/*"]

# D1 — create with:  wrangler d1 create fantasy_analyst
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "fantasy_analyst"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# "mock" (no network, no quota), "sportsgameodds" or "the-odds-api".
#
# Live on SportsGameOdds. The hold until now was that the strategy had never
# met a real slate; it has now been checked against one, and the check found
# the thing that would have made the switch look like a provider with no data:
# roster teams were being sent as Sleeper's codes (SF) and the provider's team
# filter only answers to its own (SAN_FRANCISCO_49ERS_NFL), returning an empty
# list — billed — for every team. The adapter now translates.
#
# The key must reach the Worker as a secret; the Deploy workflow publishes it.
# Without it the provider reports itself unconfigured, Setup says the key is
# missing, and no line is invented in the meantime.
VEGAS_PROVIDER = "sportsgameodds"

# The dedicated address your FF Newsletter is subscribed to. Fill this in AFTER
# you set up Cloudflare Email Routing (docs/SETUP.md, step 5). The app shows this
# address in Settings so you know where to subscribe. Leave it empty until then —
# the app will simply say the address is not ready yet.
# You can also set/override it inside the app under Setup -> Newsletter.
NEWSLETTER_ADDRESS = "fantasy-news@juncaj.net"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   APP_PASSPHRASE   login passphrase for the private tool
#   SESSION_SECRET   random 32+ byte string used to sign session cookies
#   ODDS_API_KEY     only when VEGAS_PROVIDER = "the-odds-api"
#   SPORTSGAMEODDS_API_KEY  when VEGAS_PROVIDER = "sportsgameodds" (the Deploy
#                    workflow publishes this from the repository secret of the
#                    same name, so it does not need putting by hand)

[triggers]
# Every 5 minutes -> injury check. Almost always a conditional 304 with no body
#   and no database write; see migrations/0013 and core/injury/nflverse.ts. A
#   flat cadence rather than fixed windows because kickoff is 9:30am for London
#   games, Thursday night, Friday on holidays and Saturday in December, and a
#   player is ruled out ninety minutes before any of them.
# Saturday 23:00 UTC and Sunday 15:00 UTC -> Vegas refresh.
# Daily 09:00 UTC -> Sleeper player dictionary sync + last season's statistics.
# Day-of-week must be named or 1-7 here: Cloudflare rejects "0" for Sunday.
crons = ["*/5 * * * *", "0 23 * * SAT", "0 15 * * SUN", "0 9 * * *"]

[observability]
enabled = true
